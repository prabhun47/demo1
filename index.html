<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Registry</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --ink: #1a1410;
    --accent: #c84b2f;
    --card: #fefcf7;
    --border: #c8bfaa;
    --muted: #8a7f6e;
    --row-hover: #f0ebe0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  header h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .entry-count {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: auto;
  }

  .form-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 28px 32px;
    margin-bottom: 32px;
    box-shadow: 4px 4px 0 var(--border);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  input[type="text"] {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200, 75, 47, 0.12);
  }

  input[type="text"]::placeholder {
    color: var(--border);
  }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn-submit:hover {
    background: var(--accent);
  }

  .btn-submit:active {
    transform: scale(0.99);
  }

  /* Table */
  .table-section h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    margin-bottom: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .table-wrap {
    border: 1.5px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
  }

  thead tr {
    background: var(--ink);
    color: var(--bg);
  }

  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  td {
    padding: 11px 16px;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr:hover td { background: var(--row-hover); }

  .td-no { color: var(--muted); font-size: 0.75rem; }

  .td-delete {
    text-align: right;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--border);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 4px;
    transition: color 0.15s;
    line-height: 1;
  }

  .btn-delete:hover { color: var(--accent); }

  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 2px;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @keyframes fadeInRow {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .new-row td { animation: fadeInRow 0.25s ease forwards; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Name <em>Registry</em></h1>
    <span class="entry-count" id="entry-count">0 entries</span>
  </header>

  <div class="form-card">
    <div class="form-row">
      <div class="field">
        <label for="first">First Name</label>
        <input type="text" id="first" placeholder="e.g. Ada" autocomplete="off">
      </div>
      <div class="field">
        <label for="last">Last Name</label>
        <input type="text" id="last" placeholder="e.g. Lovelace" autocomplete="off">
      </div>
    </div>
    <button class="btn-submit" id="submitBtn">+ Add to Registry</button>
  </div>

  <div class="table-section">
    <h2>Registered Names</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr id="emptyRow">
            <td colspan="4" class="empty-state">No entries yet — add one above</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const firstInput  = document.getElementById('first');
  const lastInput   = document.getElementById('last');
  const submitBtn   = document.getElementById('submitBtn');
  const tableBody   = document.getElementById('tableBody');
  const emptyRow    = document.getElementById('emptyRow');
  const entryCount  = document.getElementById('entry-count');
  const toast       = document.getElementById('toast');

  let entries = [];
  let toastTimer;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function updateCount() {
    entryCount.textContent = entries.length === 1 ? '1 entry' : `${entries.length} entries`;
  }

  function renderTable() {
    tableBody.innerHTML = '';
    if (entries.length === 0) {
      tableBody.innerHTML = '<tr id="emptyRow"><td colspan="4" class="empty-state">No entries yet — add one above</td></tr>';
    } else {
      entries.forEach((e, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="td-no">${String(i + 1).padStart(2, '0')}</td>
          <td>${e.first}</td>
          <td>${e.last}</td>
          <td class="td-delete"><button class="btn-delete" data-id="${e.id}" title="Remove">✕</button></td>
        `;
        tableBody.appendChild(tr);
        requestAnimationFrame(() => tr.classList.add('new-row'));
      });
    }
    updateCount();
  }

  submitBtn.addEventListener('click', () => {
    const first = firstInput.value.trim();
    const last  = lastInput.value.trim();

    if (!first && !last) { showToast('Please enter a name.'); firstInput.focus(); return; }
    if (!first)          { showToast('First name is required.'); firstInput.focus(); return; }
    if (!last)           { showToast('Last name is required.'); lastInput.focus(); return; }

    entries.push({ id: Date.now(), first, last });
    firstInput.value = '';
    lastInput.value  = '';
    firstInput.focus();
    renderTable();
    showToast(`Added: ${first} ${last}`);
  });

  tableBody.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const entry = entries.find(x => x.id === id);
    entries = entries.filter(x => x.id !== id);
    renderTable();
    if (entry) showToast(`Removed: ${entry.first} ${entry.last}`);
  });

  [firstInput, lastInput].forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
  });
</script>
</body>
</html>
